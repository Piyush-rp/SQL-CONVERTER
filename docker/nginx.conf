server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback - client-side routing (react-router) owns all non-file,
    # non-/api paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to the backend so the browser only sees one origin -
    # avoids CORS entirely in production (docker-compose sets this up on
    # the shared network; `backend` resolves via Docker's internal DNS).
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;

    location ~* \.(?:css|js|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
