# [project] exists so platforms that install from pyproject.toml (e.g. Vercel)
# get the runtime dependencies. Keep in sync with requirements.txt, which
# additionally carries the test-only packages (pytest, pytest-asyncio).
[project]
name = "ai-sql-copilot-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.139.0",
    "uvicorn[standard]==0.51.0",
    "starlette==1.3.1",
    "sqlalchemy==2.0.51",
    "alembic==1.18.5",
    "psycopg2-binary==2.9.12",
    "pymysql==1.2.0",
    "pyodbc==5.3.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "email-validator==2.3.0",
    "bcrypt==5.0.0",
    "python-jose[cryptography]==3.5.0",
    "cryptography==49.0.0",
    "langchain==1.3.13",
    "langchain-core==1.4.9",
    "langgraph==1.2.9",
    "langchain-openai==1.3.5",
    "langchain-anthropic==1.4.8",
    "openai==2.45.0",
    "anthropic==0.116.0",
    "sqlglot==30.12.0",
    "loguru==0.7.3",
    "prometheus-client==0.25.0",
    "redis==8.0.1",
    "hvac==2.4.0",
    "faiss-cpu==1.14.3",
    "scikit-learn==1.9.0",
    "numpy>=1.26,<2.5",
    "httpx==0.28.1",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
pythonpath = ["."]
